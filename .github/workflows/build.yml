name: Build plugin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: mvn -B clean package -f "$(find . -name pom.xml -not -path '*/target/*' | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: SaikoMC
          path: "**/target/SaikoMC.jar"
