# ===== SaikoMC config =====
prefix: "&b&lSaikoMC &8» &r"
currency:
  symbol: "$"
starting-balance: 500

gambling:
  min-bet: 10
  max-bet: 10000000000000
  cooldown-seconds: 3
  house-edge-percent: 5        # cut taken from coinflip/dice profit
  broadcast-wins-over: 100000000000   # announce big wins to the server
  slots:
    two-multiplier: 1.3        # 2 matching symbols
    three-multiplier: 10       # 3 matching symbols
    jackpot-multiplier: 25     # 3x Seven

daily:
  base: 100
  streak-bonus: 25             # extra per consecutive day
  max-streak-days: 14

# /ah auction house
auction:
  duration-hours: 48           # listings expire after this, items go to /ah expired
  tax-percent: 5               # taken from the seller when an item sells
  max-listings-per-player: 10

bounty:
  min-amount: 100

lottery:
  ticket-price: 100
  max-tickets-per-player: 20
  draw-interval-minutes: 60
  tax-percent: 10

# Money for killing mobs (randomised +-20%)
mob-rewards:
  ZOMBIE: 5
  SKELETON: 5
  SPIDER: 4
  CREEPER: 8
  ENDERMAN: 15
  WITCH: 20
  BLAZE: 15
  WITHER_SKELETON: 30
  ELDER_GUARDIAN: 500
  WARDEN: 1500
  ENDER_DRAGON: 5000

# ===== Scoreboard =====
# Placeholders: %player% %money% %money_full% %rank% %clan% %kills% %deaths% %kdr%
#               %playtime% %ip% %online% %max% %ping%   (any PlaceholderAPI placeholder also works)
scoreboard:
  enabled: true
  update-ticks: 20
  title: "&b&lSAIKOMC"
  server-ip: "saikoo.play.hosting"   # <- put your real server IP here
  lines:                          # max 15 lines
    - "&8&m                    "
    - "&b&l» &fMoney: &a%money%"
    - "&b&l» &fRank: &e%rank%"
    - "&b&l» &fClan: &d%clan%"
    - "&b&l» &fKills: &c%kills%"
    - "&b&l» &fPlaytime: &b%playtime%"
    - "&b&l» &fLevel: &a%level% &7(%exp% xp)"
    - "&7%ip%"

rank:
  mode: group        # group = LuckPerms primary group name | prefix = LuckPerms prefix
  fallback: "Member"

clan:
  placeholder: "%clan_name_formatted%"
  none-text: "None"
# ===== Spawners (the shop catalog itself is in shop.yml) =====
spawners:
  enabled: true
  cycle-seconds: 15       # how often every spawner 'produces'
  mobs-per-cycle: 4       # mobs each spawner counts per cycle (x stack size)
  max-stack: 1000         # max spawners in one stack
  storage-per-spawner: 1000   # item capacity per spawner in the stack
  require-silk-touch: false    # silk touch needed to pick spawners up
  # price is what /spawner shop charges. Drops are sold at shop.yml sell prices.
  types:
    ZOMBIE:
      price: 15000
